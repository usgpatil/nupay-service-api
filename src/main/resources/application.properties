# Use an in-memory H2 database during automated tests
spring.datasource.url=jdbc:h2:mem:nupaytest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and remove test tables automatically
spring.jpa.hibernate.ddl-auto=create-drop